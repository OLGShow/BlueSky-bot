<!DOCTYPE html>
<html><head><title>BlueSky Bot APT Repo</title></head>
<body>
<h1>BlueSky Bot APT Repository</h1>
<p>Add this repo:</p>
<pre>
echo "deb [trusted=yes] https://olgshow.github.io/BlueSky-bot/apt stable main" | sudo tee /etc/apt/sources.list.d/bluesky-bot.list
sudo apt update
sudo apt install bluesky-bot
</pre>
</body></html>
